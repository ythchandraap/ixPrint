name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-13
            pdfium: mac-x64
            bundles: dmg
          - name: macOS Apple Silicon
            os: macos-14
            pdfium: mac-arm64
            bundles: dmg
          - name: Windows x64
            os: windows-latest
            pdfium: win-x64
            bundles: nsis,msi
          - name: Linux x64
            os: ubuntu-22.04
            pdfium: linux-x64
            bundles: appimage,deb

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libcups2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            wget

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Fetch target PDFium
        run: bun run fetch-pdfium ${{ matrix.pdfium }}

      - name: Build installer
        run: bun run tauri build --bundles "${{ matrix.bundles }}" --ci

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ix.print-${{ matrix.pdfium }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
