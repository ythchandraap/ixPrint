name: Build installers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build (tag releases build all platforms)
        type: choice
        options:
          - windows
          - macos
          - linux
          - all
        default: windows
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality-gates:
    name: Release quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libcups2-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev wget

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Fetch checksum-verified PDFium
        run: bun run fetch-pdfium linux-x64

      - name: Test frontend
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Run Rust Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri

  prepare-build-matrix:
    name: Select installer targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        shell: bash
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          case "$TARGET" in
            windows)
              matrix='{"include":[{"name":"Windows x64","os":"windows-latest","pdfium":"win-x64","bundles":"nsis,msi"}]}'
              ;;
            macos)
              matrix='{"include":[{"name":"macOS Intel","os":"macos-15-intel","pdfium":"mac-x64","bundles":"dmg"},{"name":"macOS Apple Silicon","os":"macos-15","pdfium":"mac-arm64","bundles":"dmg"}]}'
              ;;
            linux)
              matrix='{"include":[{"name":"Linux x64","os":"ubuntu-24.04","pdfium":"linux-x64","bundles":"appimage,deb"}]}'
              ;;
            all)
              matrix='{"include":[{"name":"macOS Intel","os":"macos-15-intel","pdfium":"mac-x64","bundles":"dmg"},{"name":"macOS Apple Silicon","os":"macos-15","pdfium":"mac-arm64","bundles":"dmg"},{"name":"Windows x64","os":"windows-latest","pdfium":"win-x64","bundles":"nsis,msi"},{"name":"Linux x64","os":"ubuntu-24.04","pdfium":"linux-x64","bundles":"appimage,deb"}]}'
              ;;
            *)
              echo "Unsupported target: $TARGET" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: [quality-gates, prepare-build-matrix]
    runs-on: ${{ matrix.os }}
    environment:
      name: ${{ matrix.os == 'windows-latest' && 'windows-release' || 'release' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-build-matrix.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libcups2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            wget

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Require Windows signing credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            throw "Blocked: configure WINDOWS_PFX_BASE64 and WINDOWS_PFX_PASSWORD before creating a Windows release candidate."
          }

      - name: Require Apple signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Blocked: configure $name before creating a macOS release candidate." >&2
              exit 1
            fi
          done

      - name: Fetch target PDFium
        run: bun run fetch-pdfium ${{ matrix.pdfium }}

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/ixprint-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/ixprint-signing.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Prepare Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'ixprint-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          "WINDOWS_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer
        run: bun run tauri build --bundles "${{ matrix.bundles }}" --ci
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          WINDOWS_PFX_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_PFX_PASSWORD || '' }}

      - name: Verify signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s globstar nullglob
          apps=(src-tauri/target/release/bundle/**/*.app)
          dmgs=(src-tauri/target/release/bundle/**/*.dmg)
          if [ ${#apps[@]} -eq 0 ] || [ ${#dmgs[@]} -eq 0 ]; then
            echo "Expected a signed .app and .dmg installer." >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          for dmg in "${dmgs[@]}"; do
            xcrun stapler validate "$dmg"
          done

      - name: Verify Windows installer signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          if ($installers.Count -eq 0) { throw 'No Windows installers were built.' }
          foreach ($installer in $installers) {
            & signtool.exe verify /pa $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $($installer.FullName)" }
          }

      - name: Verify PDFium notices inside final installer
        run: bun scripts/verify-release-resources.mjs ${{ matrix.pdfium }} src-tauri/target/release/bundle

      - name: Write version and checksum manifest
        run: bun scripts/write-artifact-manifest.mjs ${{ matrix.pdfium }} src-tauri/target/release/bundle

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ix.print-${{ matrix.pdfium }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/artifact-manifest.txt
