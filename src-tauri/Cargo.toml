[package]
name = "ixprint"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ix_print_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
local-ip-address = "0.6.4"
tauri-plugin-os = "2"
actix-web = "4.0"
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3.31"
actix-multipart = "0.7.2"
sanitize-filename = "0.6.0"
dirs = "6.0.0"
actix-cors = "0.7.1"
sha2 = "0.10"
# Print-result callbacks: HTTP(S) POST, HMAC-signed.
ureq = { version = "3", features = ["multipart"] }
hmac = "0.12"
# Templates: barcodes, QR codes and PNG previews.
qrcode = { version = "0.14", default-features = false }
barcoders = { version = "2", default-features = false, features = ["std"] }
png = "0.17"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Must match the PDFium build fetched by scripts/fetch-pdfium.mjs.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe", "image_latest"] }
# Images in designs sent as data by clients (the editor converts everything to PNG itself).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_Xps",
] }

# Release builds: no symbols or debug info, whole-program optimisation. Makes
# the binary smaller and much harder to read back into source-level structure.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
incremental = false
